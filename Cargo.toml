[workspace]
members = ["algorand-stateproof", "algorand-lc-host"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[workspace.dependencies]
algorand-stateproof = { path = "algorand-stateproof" }
# Pinned to the exact versions SP1 ships precompile patches for (the bridge's SP1 program patches them).
sha2 = { version = "=0.10.8", default-features = false }
sha3 = { version = "=0.10.8", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
alloy-sol-types = { version = "1", default-features = false }

# Verifying a mainnet state proof runs ~100 Falcon-1024 verifications and thousands of
# Sumhash512 compressions; keep tests fast by optimizing them.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
