[package]
name = "algorand-lc-host"
description = "Host-side tooling for the Algorand state proof light client: fetch state proofs from algod/indexer, verify natively, build transaction inclusion proofs for Ethereum."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "algo-lc"
path = "src/bin/algo-lc.rs"

[dependencies]
algorand-stateproof = { workspace = true, features = ["serde", "sol", "std"] }
alloy-sol-types = { workspace = true, features = ["std"] }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.10.8" }
ureq = { version = "2", features = ["json"] }
